name: Build LunaTV Enhanced (MoonTechLab 基座) — 互踢/设备禁用 + 去广告 + 错误静默 + 防爆破/记住用户名

# ============================================================
# 单文件全合一版：4 项改造全部内嵌在本 yml 里。
# 用法：把本文件放到你 fork 仓库的 .github/workflows/build.yml，
#      然后在 Actions 页点 Run workflow，直接 Run 即可（参数已设默认值）。
# 无需上传任何其他文件、无需补丁仓库。
#
# 基座：MoonTechLab/LunaTV 官方 release v100.1.3（与 laboratorys/LunaTV 是完全不同的项目）
# 流程：checkout 官方干净 release -> 解内嵌补丁 -> 应用 4 项改造
#      -> 符号校验 -> 增强版 Dockerfile 编译推 GHCR。
#
# 4 项改造：
#   1) 单用户在线互踢 + 终端识别 + 历史设备>MAX_USER_DEVICES(默认10)自动禁用
#   2) 网页去广告（四层启发式，专治赌场广告异域域名分片）
#   3) 全局错误静默（离线播放不弹红卡片，HIDE_GLOBAL_ERRORS=false 可恢复）
#   4) 登录防爆破（连续失败 2 次要验证码）+ 记住上一次登录名
#
# 注意：官方基座无 sqlite。多用户/互踢/设备禁用需 NEXT_PUBLIC_STORAGE_TYPE
#      设为 redis / kvrocks / upstash；localstorage 为单密码模式，自动跳过这些功能。
# ============================================================
on:
  workflow_dispatch:
    inputs:
      version:
        description: '官方 release tag（默认 v100.1.3，通常无需改）'
        required: true
        default: 'v100.1.3'
      image_tag:
        description: '产出镜像标签'
        required: false
        default: '100.1.3-enh1'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # ---------- 0. 计算镜像名 ----------
      - name: 计算镜像名
        id: img
        run: |
          VER="${{ github.event.inputs.version }}"
          TAG="${{ github.event.inputs.image_tag }}"
          [ -z "$TAG" ] && TAG="$VER"
          if ! echo "$TAG" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "ERROR: 镜像标签只能包含字母、数字、点、下划线、连字符" >&2
            exit 1
          fi
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${OWNER}/lunatv" >> "$GITHUB_OUTPUT"
          echo "源码版本: ${VER}  镜像目标: ${{ env.REGISTRY }}/${OWNER}/lunatv:${TAG}"

      # ---------- 1. checkout 官方干净 release ----------
      - name: Checkout 官方源码
        uses: actions/checkout@v5
        with:
          repository: MoonTechLab/LunaTV
          ref: ${{ steps.img.outputs.version }}
          path: source
          fetch-depth: 0

