        run: |
          set -euo pipefail
          printf '%s' "$PATCH_ZIP_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/patches.zip"
          rm -rf "$GITHUB_WORKSPACE/patches"
          unzip -q "$RUNNER_TEMP/patches.zip" -d "$GITHUB_WORKSPACE/patches"
          echo "已解出补丁文件数：$(find "$GITHUB_WORKSPACE/patches" -type f | wc -l)"

      # ---------- 3. 放置整文件替换 ----------
      - name: 应用整文件补丁
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/patches"
          S="$GITHUB_WORKSPACE/source"
          # 会话/设备/终端/去广告 lib
          cp "$P/lib/session.ts"          "$S/src/lib/session.ts"
          cp "$P/lib/device.ts"           "$S/src/lib/device.ts"
          cp "$P/lib/loginGuard.ts"       "$S/src/lib/loginGuard.ts"
          cp "$P/lib/heuristicAdFilter.ts" "$S/src/lib/heuristicAdFilter.ts"
          # 登录页 + 登录接口
          cp "$P/app-login-page.tsx"      "$S/src/app/login/page.tsx"
          cp "$P/api/login-route.ts"      "$S/src/app/api/login/route.ts"
          # 新增接口目录
          mkdir -p "$S/src/app/api/captcha" "$S/src/app/api/session/verify"
          cp "$P/api/captcha-route.ts"        "$S/src/app/api/captcha/route.ts"
          cp "$P/api/session-verify-route.ts" "$S/src/app/api/session/verify/route.ts"
          # 全局会话守卫组件
          cp "$P/components/SessionGuard.tsx" "$S/src/components/SessionGuard.tsx"
          echo "整文件补丁放置完成"

      # ---------- 4. 小改动（layout / 全局错误 / 播放页 / 用户类型） ----------
      - name: 应用原地小补丁
        run: |
          python3 "$GITHUB_WORKSPACE/patches/apply_inplace.py" "$GITHUB_WORKSPACE/source"

      # ---------- 5. 符号校验 ----------
      - name: 校验全部补丁符号
        run: |
          set -euo pipefail
          S="$GITHUB_WORKSPACE/source"
          echo "--- 1) 互踢/终端识别/设备禁用 ---"
          grep -q "onLogin" "$S/src/lib/session.ts"
          grep -q "deviceHistory" "$S/src/lib/session.ts"
          grep -q "MAX_USER_DEVICES" "$S/src/lib/session.ts"
          grep -q "verifySession" "$S/src/app/api/session/verify/route.ts"
          grep -q "X-Device-Id" "$S/src/components/SessionGuard.tsx"
          grep -q "sess.sid" "$S/src/app/api/login/route.ts"
          grep -q "deviceHistory?: string\[\]" "$S/src/lib/admin.types.ts"
          echo "--- 2) 去广告 ---"
          grep -q "export function stripAdGroups" "$S/src/lib/heuristicAdFilter.ts"
          grep -q "stripForeignDomainAdGroups" "$S/src/lib/heuristicAdFilter.ts"
          grep -q "stripAdGroups(m3u8Content)" "$S/src/app/play/page.tsx"
          echo "--- 3) 全局错误静默 ---"
          grep -q "HIDE_GLOBAL_ERRORS" "$S/src/app/layout.tsx"
          grep -qF "console.error('[globalError]', message);" "$S/src/components/GlobalErrorIndicator.tsx"
          echo "--- 4) 防爆破 + 记住用户名 ---"
          grep -q "CAPTCHA_THRESHOLD" "$S/src/lib/loginGuard.ts"
          grep -q "issueCaptcha" "$S/src/app/api/captcha/route.ts"
          grep -q "X-Captcha-Token" "$S/src/app/login/page.tsx"
          grep -q "LAST_USERNAME_KEY" "$S/src/app/login/page.tsx"
          grep -q "api/captcha|api/session/verify" "$S/src/middleware.ts"
          echo "全部补丁符号校验通过"

      # ---------- 6. 类型检查（本地先过一遍，失败不阻断镜像，仅提示） ----------
      - name: 安装依赖并类型检查
        working-directory: ${{ github.workspace }}/source
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run typecheck || echo "WARN: typecheck 有告警，请关注（不阻断构建）"

      # ---------- 7. 构建并推送 GHCR（用官方 Dockerfile，无需改动） ----------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}/source
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.image }}:latest

      - name: 完成提示
        run: |
          echo "镜像已推送：${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag}} 及 :latest"
          echo "包含：单用户互踢+终端识别+设备>10禁用 / 四层去广告 / 全局错误静默 / 登录防爆破+记住用户名"
